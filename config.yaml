# Interview Assistant Configuration

# LMStudio Settings
lmstudio:
  host: "localhost"
  port: 1234
  api_endpoint: "/v1/chat/completions"
  
# Model Settings (мультимодальная)
model:
  name: "Qwen/Qwen2.5-VL-7B-Instruct-GGUF"
  quantization: "Q4_K_M"  # Q4_K_M, Q5_K_M, Q8_0
  max_tokens: 1024
  temperature: 0.7
  
# Audio Settings
audio:
  device_index: null  # null = default, или номер устройства (WASAPI loopback)
  sample_rate: 16000
  buffer_duration: 3.0  # секунды буфера для транскрипции
  transcription_model: "distil-large-v3"  # distil-large-v3 (быстро), medium (точнее)
  
# Screen Capture Settings
screen:
  normal_interval: 20  # секунд в обычном режиме
  fast_interval: 5     # секунд в быстром режиме (по хоткею или детекции кода)
  quality: 80          # JPEG качество (1-100)
  max_buffer_size: 5   # максимальное количество скриншотов в буфере
  
# Hotkeys (в формате 'modifier+key')
hotkeys:
  toggle_fast_mode: "Ctrl+Shift+S"    # Тумблер быстрого режима скриншотов
  pause_assistant: "Ctrl+Shift+A"     # Пауза всего ассистента
  force_request: "Ctrl+Shift+R"       # Принудительный запрос ответа от ИИ
  
# Overlay GUI Settings
overlay:
  position: "bottom-right"  # top-left, top-right, bottom-left, bottom-right
  offset_x: 20              # отступ от края в пикселях
  offset_y: 100
  width: 450                # ширина окна
  height: 300               # высота окна (автоматически растягивается)
  font_size: 12
  transparency: 0.9         # 0.0 - 1.0 (1.0 = полностью непрозрачный)
  
# Context Detection Settings
context:
  question_detection_threshold: 0.7  # порог уверенности для детекции вопроса
  code_detection_keywords:           # ключевые слова для детекции "пора писать код"
    - "напишите код"
    - "реализуйте функцию"
    - "решите задачу"
    - "напишите алгоритм"
    - "создайте класс"
    - "опишите решение"
    - "implement"
    - "write code"
    - "solve this problem"
  conversation_window: 30  # секунд контекста диалога для анализа
  
# Logging Settings
logging:
  level: "INFO"           # DEBUG, INFO, WARNING, ERROR
  log_file: "interview_assistant.log"
  save_transcripts: true  # сохранять транскрипты в logs/transcripts/
  save_screenshots: false # сохранять скриншоты в screenshots/

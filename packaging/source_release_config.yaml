audio:
  system_device_id: null
  microphone_device_id: null
  sample_rate: 16000
  language: auto
  stt_model: large-v3-turbo
lmstudio:
  host: 127.0.0.1
  port: 1234
  text_model: ""
  vision_model: ""
  preferred_device_name: ""
capture:
  mode: event
  persistent_screenshots: false
  black_frame_threshold: 0.92
search:
  mode: auto
  provider: firecrawl
  timeout_seconds: 5.0
overlay:
  opacity: 0.88
  max_height: 360
hotkeys:
  force_request: ctrl+shift+space
  screenshot: ctrl+shift+s
  pause: ctrl+shift+p
  overlay_visibility: ctrl+shift+o
  overlay_interaction: ctrl+shift+i
  forced_web_search: ctrl+shift+w
  clear_answer: ctrl+shift+c

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-assistant"
version = "0.1.3"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PyQt6>=6.7,<7",
  "qasync>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "platformdirs>=4.2,<5",
  "keyring>=25,<26",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "mcp>=1.26,<2",
  "numpy>=1.26,<3",
  "PyAudioWPatch>=0.2.12.7,<0.3",
  "faster-whisper>=1.2.1,<2",
  "mss>=9,<11",
  "Pillow>=10,<12",
  "ImageHash>=4.3,<5",
  "pynput>=1.7,<2",
  "pywin32>=308",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cuda-runtime-cu12==12.9.79",
  "nvidia-cublas-cu12==12.9.2.10",
  "nvidia-cudnn-cu12==8.9.7.29",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-qt>=4.4,<5",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pyinstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["interview_assistant*"]
exclude = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
